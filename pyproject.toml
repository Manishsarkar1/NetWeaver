[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanta"
version = "0.1.0"
description = "Variable Network Topology Architecture controller and dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "VANTA Maintainers" }
]
dependencies = [
  "ryu>=4.34",
  "rich>=13.0.0",
  "flask>=2.3.0",
  "flask-socketio>=5.3.0",
  "eventlet>=0.33.0",
  "python-socketio>=5.9.0",
  "flask-login>=0.6.0",
  "reportlab>=4.0.0",
  "redis>=5.0.0"
]

[project.scripts]
vanta = "vanta.cli:main"
vanta-controller = "vanta.cli:run_controller"

[tool.setuptools]
include-package-data = true
py-modules = ["ultimate_mtd_controller"]

[tool.setuptools.packages.find]
include = ["vanta", "vanta.*", "vanta_core", "vanta_core.*"]

[tool.setuptools.package-data]
vanta = ["defaults/*.json", "templates/*.html"]
