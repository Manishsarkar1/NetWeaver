<!DOCTYPE html>
<html lang="en">
<head>
    <title>MTD Controller - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
        }

        .login-container {
            background: rgba(30, 30, 46, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(100, 100, 255, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #7dd3fc;
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(125, 211, 252, 0.3);
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #7dd3fc;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(100, 100, 255, 0.3);
            border-radius: 8px;
            background: rgba(45, 45, 68, 0.8);
            color: #e0e0e0;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #7dd3fc;
            box-shadow: 0 0 10px rgba(125, 211, 252, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .default-creds {
            margin-top: 20px;
            padding: 15px;
            background: rgba(45, 45, 68, 0.6);
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
        }

        .default-creds h3 {
            color: #7dd3fc;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .default-creds p {
            color: #94a3b8;
            font-size: 0.85em;
            margin: 4px 0;
        }

        .default-creds code {
            color: #6ee7b7;
            background: rgba(45, 45, 68, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .shield-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="shield-icon">🛡️</div>
            <h1>MTD Controller</h1>
            <p>Moving Target Defense System</p>
        </div>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

  <div class="creds-box">
    <div class="creds-label">Default Credentials</div>
    <div class="creds-row">
      <span>Username</span>
      <code>admin</code>
    </div>
    <div class="creds-row">
      <span>Password</span>
      <code>mtd2024</code>
    </div>
</body>
</html>
