<!DOCTYPE html>
<html>
<head>
    <title>MTD Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            margin: 0;
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: white;
            padding: 30px;
            border-radius: 15px;
        }
        h1 { color: #667eea; text-align: center; }
        .stats { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin: 20px 0;
        }
        .stat-box { 
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; 
            padding: 20px; 
            border-radius: 10px; 
            text-align: center;
        }
        .stat-value { font-size: 2em; font-weight: bold; }
        .stat-label { font-size: 0.9em; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; }
        .event { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 5px; border-left: 4px solid #667eea; }
        .ip-badge { display: inline-block; padding: 5px 10px; border-radius: 5px; font-family: monospace; margin: 2px; }
        .real-ip { background: #dbeafe; color: #1e40af; }
        .virtual-ip { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ MTD Controller Dashboard</h1>
        <div class="stats">
            <div class="stat-box"><div class="stat-value" id="uptime">00:00:00</div><div class="stat-label">Uptime</div></div>
            <div class="stat-box"><div class="stat-value" id="totalMorphs">0</div><div class="stat-label">Total Morphs</div></div>
            <div class="stat-box"><div class="stat-value" id="vipAllocations">0</div><div class="stat-label">VIP Allocations</div></div>
            <div class="stat-box"><div class="stat-value" id="icmpPackets">0</div><div class="stat-label">ICMP Packets</div></div>
            <div class="stat-box"><div class="stat-value" id="tcpPackets">0</div><div class="stat-label">TCP Packets</div></div>
            <div class="stat-box"><div class="stat-value" id="udpPackets">0</div><div class="stat-label">UDP Packets</div></div>
        </div>
        <h2>Current VIP Mappings</h2>
        <table><thead><tr><th>Real IP</th><th></th><th>Virtual IP</th></tr></thead>
        <tbody id="mappingsBody"><tr><td colspan="3" style="text-align:center;">No mappings yet</td></tr></tbody></table>
        <h2>Recent Morph Events</h2>
        <div id="morphEvents"><p style="text-align:center; color:#999;">No events yet</p></div>
        <h2>Active Connections</h2>
        <div id="connections"><p style="text-align:center; color:#999;">No connections yet</p></div>
    </div>
    <script>
        const socket = io();
        function updateStats(stats) {
            document.getElementById('uptime').textContent = stats.uptime || '00:00:00';
            document.getElementById('totalMorphs').textContent = stats.total_morphs || 0;
            document.getElementById('vipAllocations').textContent = stats.vip_allocations || 0;
            const packets = stats.packets_by_protocol || {};
            document.getElementById('icmpPackets').textContent = packets.ICMP || 0;
            document.getElementById('tcpPackets').textContent = packets.TCP || 0;
            document.getElementById('udpPackets').textContent = packets.UDP || 0;
            updateMorphHistory(stats.morph_history || []);
            updateConnections(stats.active_connections || []);
        }
        function updateMappings(mappings) {
            const tbody = document.getElementById('mappingsBody');
            if (!mappings || mappings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No mappings yet</td></tr>';
                return;
            }
            tbody.innerHTML = mappings.map(m => '<tr><td><span class="ip-badge real-ip">'+m.real_ip+'</span></td><td style="text-align:center;">↔</td><td><span class="ip-badge virtual-ip">'+m.vip+'</span></td></tr>').join('');
        }
        function updateMorphHistory(history) {
            const container = document.getElementById('morphEvents');
            if (!history || history.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#999;">No events yet</p>';
                return;
            }
            container.innerHTML = history.slice().reverse().slice(0,10).map(event => '<div class="event"><strong>'+event.protocol+' Morph</strong> - '+event.timestamp+'<br>'+event.ip1+': '+event.old_vip1+' → '+event.new_vip1+'<br>'+event.ip2+': '+event.old_vip2+' → '+event.new_vip2+'</div>').join('');
        }
        function updateConnections(connections) {
            const container = document.getElementById('connections');
            if (!connections || connections.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#999;">No connections yet</p>';
                return;
            }
            container.innerHTML = connections.slice().reverse().slice(0,10).map(conn => '<div class="event"><strong>'+conn.protocol+'</strong>: '+conn.src_ip+(conn.src_port?':'+conn.src_port:'')+' → '+conn.dst_ip+(conn.dst_port?':'+conn.dst_port:'')+' <span style="float:right;">'+conn.timestamp+'</span></div>').join('');
        }
        socket.on('connect', () => console.log('Connected'));
        socket.on('stats_update', updateStats);
        socket.on('mappings_update', data => updateMappings(data.mappings));
        setInterval(() => { fetch('/api/stats').then(r => r.json()).then(updateStats).catch(err => console.error('Error:', err)); }, 2000);
    </script>
</body>
</html>
