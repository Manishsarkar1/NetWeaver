<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Neon Pac-Man loop animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040611"/>
      <stop offset="100%" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="loopPath" d="M 95 60 H 1105 V 280 H 95 Z"/>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <text x="600" y="34" text-anchor="middle" fill="#5df7ff" font-size="22" font-family="Consolas, 'Courier New', monospace" filter="url(#glow)">VANTA // Dynamic Border Defense Loop</text>

  <use href="#loopPath" fill="none" stroke="#21314a" stroke-width="12"/>

  <use href="#loopPath" fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-dasharray="110 1910" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2020" dur="8s" repeatCount="indefinite"/>
  </use>

  <use href="#loopPath" fill="none" stroke="#22f6ff" stroke-width="9" stroke-linecap="round" stroke-dasharray="120 1900" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="-260" to="-2280" dur="8s" repeatCount="indefinite"/>
  </use>

  <g>
    <circle cx="0" cy="0" r="20" fill="#ffe14a" filter="url(#glow)"/>
    <circle cx="6" cy="-8" r="2.8" fill="#161616"/>
    <path d="M 0 0 L 20 -8 L 20 8 Z" fill="#040611">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="0;30;0;-30;0" dur="0.35s" repeatCount="indefinite"/>
    </path>
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#loopPath"/>
    </animateMotion>
  </g>

  <g>
    <circle cx="0" cy="0" r="9" fill="#f6c89b"/>
    <rect x="-7" y="8" width="14" height="18" rx="2" fill="#39ff8f" filter="url(#glow)"/>
    <line x1="0" y1="16" x2="16" y2="16" stroke="#7afff9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="18" cy="16" r="3" fill="#7afff9"/>
    <animateMotion begin="1.2s" dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#loopPath"/>
    </animateMotion>
  </g>

  <text x="600" y="320" text-anchor="middle" fill="#92a8cf" font-size="16" font-family="Consolas, 'Courier New', monospace">
    Pac-Man removes exposed perimeter • Defender redraws continuously
  </text>
</svg>